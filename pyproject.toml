[project]
name = "llm-analytics-with-tools"
version = "0.1.0"
description = "Mini-product with LLM analytics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-experimental>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["mypy>=1.19.1", "pyrefly>=1.0.0", "ruff>=0.15.12", "ty>=0.0.35"]

[tool.mypy]
strict = true
strict_bytes = true
local_partial_types = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = ["web_app"]
python_version = "3.13"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "TD002",  # автор в todo
    "TD003",  # ссылка на issue в todo
    "CPY001", # лицензия в начале файла
    "D100",   # docstring для модуля
    "D104",   # docstring для пакета
    "D203",   # пустая строки перед docstring класса, конфликт с D211
    "D212",   # summary на первой строке, конфликт с D213
    "FIX002", # наличие TODO
    "COM812", # конфликт с formatter
]

[tool.pyrefly]
search-path = ["web_app"]
python-version = "3.13.0"
preset = "strict"
min-severity = "info"

[tool.ty.environment]
root = ["./web_app"]

[tool.ty.rules]
all = "error"
